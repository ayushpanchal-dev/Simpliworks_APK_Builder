name: simpliworks_apk_builder
description: "Simpliworks Android APK Builder Studio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2
  path: ^1.9.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  universal_html: ^2.2.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
